<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Centro de Mando - Hana.OS v5.0 (Cloud Sync)</title>
    <!-- Importación de tipografía Andika desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Andika&display=swap" rel="stylesheet">
    
    <!-- SDKs de Firebase (Compat version para integración directa limpia en HTML/JS) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f7f3f0;
            font-family: 'Andika', sans-serif;
            color: #3b3038;
            padding: 16px;
            font-size: 15px;
        }
        
        /* Pantalla de Bloqueo con Clave */
        #authOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #f7f3f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            gap: 12px;
        }
        .auth-box {
            background: #ffffff;
            padding: 24px;
            border: 2px solid #e2d3ce;
            border-radius: 8px;
            box-shadow: 4px 4px 0px #ebd5cd;
            text-align: center;
            max-width: 350px;
            width: 100%;
        }

        .planner-container {
            max-width: 1500px;
            margin: 0 auto;
            background: #ffffff;
            border: 2px solid #e2d3ce;
            border-radius: 8px;
            box-shadow: 4px 4px 0px #ebd5cd;
            overflow: hidden;
            display: none; /* Oculto hasta autenticarse */
        }

        /* Barra Superior Estilo Notion */
        .top-bar {
            background: #f4ece6;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2d3ce;
        }
        .top-title {
            font-size: 19px;
            font-weight: bold;
            color: #6e5852;
            letter-spacing: 1px;
        }
        .retro-btn {
            background: #b5838d;
            color: white;
            border: none;
            font-family: 'Andika', sans-serif;
            font-size: 15px;
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        .retro-btn:hover { background: #926671; }

        /* Estructura Principal Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 80vh;
        }
        @media(max-width: 1100px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        /* Columna Izquierda */
        .sidebar-left {
            background: #faf6f3;
            border-right: 2px solid #e2d3ce;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sidebar-section-title {
            font-size: 15px;
            font-weight: bold;
            color: #8c6d62;
            border-bottom: 1px dashed #d8c2bb;
            margin-bottom: 8px;
            padding-bottom: 4px;
            text-transform: uppercase;
        }

        /* Hábitos Estilo Planner */
        .habit-row-mini {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 15px;
        }
        .habit-days-mini { display: flex; gap: 2px; }
        .h-box {
            width: 18px; height: 18px;
            background: #fff;
            border: 1px solid #d8c2bb;
            font-size: 11px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .h-box.active { background: #b5838d; color: #fff; border-color: #926671; }

        /* Calendario Mini Estética */
        .mini-cal {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
        }
        .mini-cal th {
            color: #8c6d62;
            padding: 2px;
            font-size: 13px;
        }
        .mini-cal td {
            border: 1px solid #f0e6e2;
            padding: 4px;
            background: #fff;
        }
        .mini-cal td.today { background: #b5838d; color: #fff; }
        .mini-cal td.muted { color: #d0c0bc; }

        /* Panel de Enlaces y Docs */
        .links-container {
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .link-card-item {
            background: #fff;
            padding: 4px 6px;
            border: 1px solid #f0e6e2;
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .link-card-item a {
            color: #b5838d;
            text-decoration: none;
            font-weight: bold;
            word-break: break-all;
        }
        .link-card-item a:hover { text-decoration: underline; }

        /* Panel Derecho: Columnas Semanales */
        .weekly-columns-area {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .week-navigation-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f4ece6;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .days-grid-columns {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }
        @media(max-width: 1300px) {
            .days-grid-columns { grid-template-columns: repeat(3, 1fr); }
        }
        @media(max-width: 800px) {
            .days-grid-columns { grid-template-columns: 1fr; }
        }

        /* Columna de Día Individual */
        .day-column {
            background: #fcf9f7;
            border: 1px solid #e2d3ce;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .day-column-header {
            background: #e8d7d1;
            color: #5c453e;
            padding: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            border-bottom: 1px solid #d8c2bb;
        }
        .day-section-box {
            padding: 8px;
            border-bottom: 1px solid #eee4df;
        }
        .day-section-title {
            font-size: 13px;
            color: #8c6d62;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .focus-input, .task-input-box {
            width: 100%;
            background: #fff;
            border: 1px solid #d8c2bb;
            font-family: 'Andika', sans-serif;
            font-size: 12px;
            padding: 3px 6px;
            color: #3b3038;
            border-radius: 3px;
        }
        
        .task-list-column {
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 6px;
        }
        .task-row-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            margin-bottom: 3px;
            background: #fff;
            padding: 2px 4px;
            border-radius: 3px;
            border: 1px solid #f0e6e2;
        }
        .progress-container {
            background: #f0e6e2;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-bar-fill {
            background: #b5838d;
            height: 100%;
            width: 0%;
        }
        .delete-btn {
            background: none; border: none; color: #b5838d; cursor: pointer; font-size: 14px; font-weight: bold;
        }
    </style>
</head>
<body>

<!-- PANTALLA DE ACCESO CLAVE MAESTRA -->
<div id="authOverlay">
    <div class="auth-box">
        <div style="font-size: 22px; font-weight: bold; color: #6e5852; margin-bottom: 10px;">🍓 HANA.OS ACCESS</div>
        <p style="font-size: 15px; color: #8c6d62; margin-bottom: 12px;">Ingresa tu clave maestra para sincronizar con Firebase:</p>
        <input type="password" id="masterPassInput" class="focus-input" placeholder="Contraseña..." style="text-align: center; margin-bottom: 10px;">
        <button class="retro-btn" style="width: 100%; padding: 6px;" onclick="verifyAccess()">Desbloquear Sistema</button>
        <p id="authErrorMsg" style="color: #b5838d; font-size: 14px; margin-top: 8px; display: none;">Clave incorrecta</p>
    </div>
</div>

<div class="planner-container" id="mainPlannerContainer">
    <!-- Barra Superior -->
    <div class="top-bar">
        <div class="top-title">✨ WEEKLY PLAN // HANA.OS (Cloud Sync Edition)</div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <span id="syncStatus" style="font-size: 13px; color: #739e82;">● Sincronizado</span>
            <span id="currentMonthYearLabel" style="font-size: 15px; color: #8c6d62;">Septiembre 2026</span>
        </div>
    </div>

    <div class="main-grid">
        <!-- COLUMNA IZQUIERDA -->
        <div class="sidebar-left">
            <div>
                <div class="sidebar-section-title">Calendario (Sep 2026)</div>
                <table class="mini-cal">
                    <thead>
                        <tr><th>Lu</th><th>Ma</th><th>Mi</th><th>Ju</th><th>Vi</th><th>Sa</th><th>Do</th></tr>
                    </thead>
                    <tbody id="miniCalendarBody"></tbody>
                </table>
            </div>

            <div>
                <div class="sidebar-section-title">Hábitos Semanales</div>
                <div id="sidebarHabitsContainer"></div>
                <div style="display: flex; gap: 4px; margin-top: 6px;">
                    <input type="text" id="newHabitInput" class="focus-input" placeholder="Nuevo hábito...">
                    <button class="retro-btn" onclick="addHabit()">+</button>
                </div>
            </div>

            <!-- MÓDULO: ENLACES Y DOCUMENTOS DIRECTOS -->
            <div>
                <div class="sidebar-section-title">Links & Docs Directos</div>
                <div class="links-container" id="linksListContainer"></div>
                <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 6px;">
                    <input type="text" id="newLinkTitle" class="focus-input" placeholder="Nombre (ej: Docs Git)...">
                    <div style="display: flex; gap: 4px;">
                        <input type="url" id="newLinkUrl" class="focus-input" placeholder="https://...">
                        <button class="retro-btn" onclick="addLink()">+</button>
                    </div>
                </div>
            </div>

            <div>
                <div class="sidebar-section-title">Notas Rápidas</div>
                <textarea id="quickNotesArea" class="focus-input" style="height: 80px; resize: none;" oninput="saveNotesDebounced()"></textarea>
            </div>
        </div>

        <!-- COLUMNA DERECHA: PLAN SEMANAL EN COLUMNAS -->
        <div class="weekly-columns-area">
            <div class="week-navigation-bar">
                <button class="retro-btn" onclick="changeWeek(-1)">◀ Semana Anterior</button>
                <span id="weekRangeLabel" style="font-weight: bold; font-size: 17px; color: #5c453e;">Semana</span>
                <button class="retro-btn" onclick="changeWeek(1)">Semana Siguiente ▶</button>
            </div>

            <div class="days-grid-columns" id="daysGridColumns"></div>
        </div>
    </div>
</div>

<script>
    // ================= CONFIGURA TU FIREBASE AQUÍ =================
    const firebaseConfig = {
        apiKey: "AIzaSyCLrChyxTXeKxkGElCJqXPrhUpYQHDqpEw",
        authDomain: "planner-51cb9.firebaseapp.com",
        projectId: "planner-51cb9",
        storageBucket: "planner-51cb9.firebasestorage.app",
        messagingSenderId: "645644135848",
        appId: "1:645644135848:web:6ef0b8bdd3aa09d4cf419d"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Contraseña maestra personalizada para proteger el sistema
    const CLAVE_MAESTRA = "hana2026"; 

    function verifyAccess() {
        const inputVal = document.getElementById('masterPassInput').value;
        if (inputVal === CLAVE_MAESTRA) {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('mainPlannerContainer').style.display = 'block';
            initApp();
        } else {
            const err = document.getElementById('authErrorMsg');
            err.style.display = 'block';
        }
    }

    let currentWeekOffset = 0;
    const diasNombres = ["LUNES", "MARTES", "MIÉRCOLES", "JUEVES", "VIERNES", "SÁBADO", "DOMINGO"];

    // Estructura de datos por defecto en Firestore
    let notionData = {
        days: {},
        habits: [
            { name: "Ejercicio", days: [false, false, false, false, false, false, false] },
            { name: "Lectura", days: [false, false, false, false, false, false, false] }
        ],
        links: [
            { title: "GitHub Portfolio", url: "https://github.com" },
            { title: "Nereida Joyas", url: "https://instagram.com" }
        ],
        notes: "Revisar pendientes de la API y reportes en Power BI."
    };

    // Sincronización en Tiempo Real con Firestore
    function initApp() {
        renderSidebarCalendar();
        
        db.collection("hana_os").doc("main_data").onSnapshot((doc) => {
            if (doc.exists) {
                notionData = doc.data();
                document.getElementById('syncStatus').innerText = "● Sincronizado en vivo";
                renderSidebar();
                renderWeeklyPlanner();
            } else {
                saveCloudData();
            }
        }, (error) => {
            document.getElementById('syncStatus').innerText = "⚠ Error de red";
            console.error("Error sincronizando Firebase: ", error);
        });
    }

    function saveCloudData() {
        document.getElementById('syncStatus').innerText = "↻ Guardando...";
        db.collection("hana_os").doc("main_data").set(notionData)
            .then(() => {
                document.getElementById('syncStatus').innerText = "● Sincronizado en vivo";
            })
            .catch((error) => {
                console.error("Error al guardar: ", error);
            });
    }

    let notesTimeout;
    function saveNotesDebounced() {
        notionData.notes = document.getElementById('quickNotesArea').value;
        clearTimeout(notesTimeout);
        notesTimeout = setTimeout(() => {
            saveCloudData();
        }, 800);
    }

    // --- LÓGICA DEL CALENDARIO Y HÁBITOS ---
    function renderSidebarCalendar() {
        const tbody = document.getElementById('miniCalendarBody');
        tbody.innerHTML = '';
        let dayCounter = 1, daysInMonth = 30, startDay = 1;
        let row = document.createElement('tr');
        for (let i = 0; i < startDay; i++) row.innerHTML += `<td class="muted">${31 - (startDay - i - 1)}</td>`;
        for (let i = startDay; i < 7; i++) {
            let isToday = (dayCounter === 21) ? 'today' : '';
            row.innerHTML += `<td class="${isToday}">${dayCounter}</td>`;
            dayCounter++;
        }
        tbody.appendChild(row);
        while (dayCounter <= daysInMonth) {
            row = document.createElement('tr');
            for (let i = 0; i < 7; i++) {
                if (dayCounter <= daysInMonth) {
                    let isToday = (dayCounter === 21) ? 'today' : '';
                    row.innerHTML += `<td class="${isToday}">${dayCounter}</td>`;
                    dayCounter++;
                } else {
                    row.innerHTML += `<td class="muted">${dayCounter - daysInMonth}</td>`;
                    dayCounter++;
                }
            }
            tbody.appendChild(row);
        }
    }

    function renderSidebar() {
        // Hábitos
        const hContainer = document.getElementById('sidebarHabitsContainer');
        hContainer.innerHTML = '';
        (notionData.habits || []).forEach((h, hIdx) => {
            let daysHtml = '';
            h.days.forEach((checked, dIdx) => {
                daysHtml += `<div class="h-box ${checked ? 'active' : ''}" onclick="toggleHabit(${hIdx}, ${dIdx})">${diasNombres[dIdx][0]}</div>`;
            });
            hContainer.innerHTML += `
                <div class="habit-row-mini">
                    <span style="width:70px; overflow:hidden;">${h.name}</span>
                    <div class="habit-days-mini">${daysHtml}</div>
                    <button class="delete-btn" onclick="deleteHabit(${hIdx})">×</button>
                </div>
            `;
        });

        // Enlaces / Docs
        const lContainer = document.getElementById('linksListContainer');
        lContainer.innerHTML = '';
        (notionData.links || []).forEach((l, lIdx) => {
            lContainer.innerHTML += `
                <div class="link-card-item">
                    <a href="${l.url}" target="_blank">🔗 ${l.title}</a>
                    <button class="delete-btn" onclick="deleteLink(${lIdx})">×</button>
                </div>
            `;
        });

        // Notas
        if(document.activeElement !== document.getElementById('quickNotesArea')) {
            document.getElementById('quickNotesArea').value = notionData.notes || "";
        }
    }

    // --- LÓGICA DEL PLANNER SEMANAL ---
    function getMonday(d, offset) {
        d = new Date(d);
        d.setDate(d.getDate() + (offset * 7));
        var day = d.getDay(),
            diff = d.getDate() - day + (day == 0 ? -6:1);
        return new Date(d.setDate(diff));
    }

    function renderWeeklyPlanner() {
        const container = document.getElementById('daysGridColumns');
        container.innerHTML = '';

        let monday = getMonday(new Date(), currentWeekOffset);
        let sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        document.getElementById('weekRangeLabel').innerText = `Semana del ${monday.getDate()} de Sep al ${sunday.getDate()} de Sep, 2026`;

        for (let i = 0; i < 7; i++) {
            let currentDay = new Date(monday);
            currentDay.setDate(monday.getDate() + i);
            let dNum = currentDay.getDate();
            let dateKey = `2026-09-${dNum < 10 ? '0'+dNum : dNum}`;

            if (!notionData.days) notionData.days = {};
            if (!notionData.days[dateKey]) {
                notionData.days[dateKey] = {
                    focus: "",
                    events: "",
                    tasks: []
                };
            }

            let dayObj = notionData.days[dateKey];
            let totalTasks = dayObj.tasks.length;
            let completedTasks = dayObj.tasks.filter(t => t.done).length;
            let percent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

            let tasksHtml = '';
            dayObj.tasks.forEach((t, tIdx) => {
                tasksHtml += `
                    <li class="task-row-item">
                        <label style="display:flex; align-items:center; word-break:break-all;">
                            <input type="checkbox" ${t.done ? 'checked' : ''} onclick="toggleTask('${dateKey}', ${tIdx})">
                            <span style="${t.done ? 'text-decoration: line-through; color: #a08c85;' : ''}">${t.text}</span>
                        </label>
                        <button class="delete-btn" onclick="deleteTask('${dateKey}', ${tIdx})">×</button>
                    </li>
                `;
            });

            const col = document.createElement('div');
            col.className = 'day-column';
            col.innerHTML = `
                <div class="day-column-header">${diasNombres[i]} ${dNum}</div>
                
                <div class="day-section-box">
                    <div class="day-section-title">Today's Focus</div>
                    <input type="text" class="focus-input" value="${dayObj.focus || ''}" oninput="updateFocus('${dateKey}', this.value)" placeholder="Enfoque del día...">
                </div>

                <div class="day-section-box">
                    <div class="day-section-title">Events / Citas</div>
                    <input type="text" class="focus-input" value="${dayObj.events || ''}" oninput="updateEvents('${dateKey}', this.value)" placeholder="Ej: Reunión BCP...">
                </div>

                <div class="day-section-box" style="flex-grow:1; display:flex; flex-direction:column;">
                    <div class="day-section-title">
                        <span>Tasks</span>
                        <span>${percent}%</span>
                    </div>
                    <div class="progress-container"><div class="progress-bar-fill" style="width: ${percent}%;"></div></div>
                    <ul class="task-list-column" style="margin-top:6px;">${tasksHtml}</ul>
                    <div style="display:flex; gap:4px; margin-top:auto;">
                        <input type="text" id="newTaskInput-${dateKey}" class="task-input-box" placeholder="Nueva tarea...">
                        <button class="retro-btn" style="padding:2px 6px;" onclick="addTask('${dateKey}')">+</button>
                    </div>
                </div>
            `;
            container.appendChild(col);
        }
    }

    function changeWeek(dir) {
        currentWeekOffset += dir;
        renderWeeklyPlanner();
    }

    // Funciones de modificación con guardado automático en Firebase
    function updateFocus(dateKey, val) { notionData.days[dateKey].focus = val; saveCloudData(); }
    function updateEvents(dateKey, val) { notionData.days[dateKey].events = val; saveCloudData(); }

    function addTask(dateKey) {
        const input = document.getElementById(`newTaskInput-${dateKey}`);
        if (!input.value.trim()) return;
        notionData.days[dateKey].tasks.push({ text: input.value.trim(), done: false });
        saveCloudData();
        renderWeeklyPlanner();
    }

    function deleteTask(dateKey, tIdx) {
        notionData.days[dateKey].tasks.splice(tIdx, 1);
        saveCloudData();
        renderWeeklyPlanner();
    }

    function toggleTask(dateKey, tIdx) {
        notionData.days[dateKey].tasks[tIdx].done = !notionData.days[dateKey].tasks[tIdx].done;
        saveCloudData();
        renderWeeklyPlanner();
    }

    function addHabit() {
        const input = document.getElementById('newHabitInput');
        if (!input.value.trim()) return;
        if (!notionData.habits) notionData.habits = [];
        notionData.habits.push({ name: input.value.trim(), days: [false, false, false, false, false, false, false] });
        input.value = '';
        saveCloudData();
        renderSidebar();
    }
    function deleteHabit(hIdx) { notionData.habits.splice(hIdx, 1); saveCloudData(); renderSidebar(); }
    function toggleHabit(hIdx, dIdx) {
        notionData.habits[hIdx].days[dIdx] = !notionData.habits[hIdx].days[dIdx];
        saveCloudData();
        renderSidebar();
    }

    function addLink() {
        const titleInput = document.getElementById('newLinkTitle');
        const urlInput = document.getElementById('newLinkUrl');
        if (!titleInput.value.trim() || !urlInput.value.trim()) return;
        if (!notionData.links) notionData.links = [];
        notionData.links.push({ title: titleInput.value.trim(), url: urlInput.value.trim() });
        titleInput.value = '';
        urlInput.value = '';
        saveCloudData();
        renderSidebar();
    }
    function deleteLink(lIdx) {
        notionData.links.splice(lIdx, 1);
        saveCloudData();
        renderSidebar();
    }
</script>

</body>
</html>
