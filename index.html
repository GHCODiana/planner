<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Centro de Mando - Hana.OS v5.0 (Notion Aesthetic)</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f7f3f0;
            font-family: 'VT323', monospace;
            color: #3b3038;
            padding: 16px;
            font-size: 18px;
        }
        .planner-container {
            max-width: 1500px;
            margin: 0 auto;
            background: #ffffff;
            border: 2px solid #e2d3ce;
            border-radius: 8px;
            box-shadow: 4px 4px 0px #ebd5cd;
            overflow: hidden;
        }
        /* Barra Superior Estilo Notion */
        .top-bar {
            background: #f4ece6;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2d3ce;
        }
        .top-title {
            font-size: 20px;
            font-weight: bold;
            color: #6e5852;
            letter-spacing: 1px;
        }
        .retro-btn {
            background: #b5838d;
            color: white;
            border: none;
            font-family: 'VT323', monospace;
            font-size: 16px;
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        .retro-btn:hover { background: #926671; }

        /* Estructura Principal Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 80vh;
        }
        @media(max-width: 1100px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        /* Columna Izquierda (Hábitos, Calendario, Notas) */
        .sidebar-left {
            background: #faf6f3;
            border-right: 2px solid #e2d3ce;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sidebar-section-title {
            font-size: 16px;
            font-weight: bold;
            color: #8c6d62;
            border-bottom: 1px dashed #d8c2bb;
            margin-bottom: 8px;
            padding-bottom: 4px;
            text-transform: uppercase;
        }

        /* Hábitos Estilo Planner */
        .habit-row-mini {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 16px;
        }
        .habit-days-mini { display: flex; gap: 2px; }
        .h-box {
            width: 16px; height: 16px;
            background: #fff;
            border: 1px solid #d8c2bb;
            font-size: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .h-box.active { background: #b5838d; color: #fff; border-color: #926671; }

        /* Calendario Mini Estética */
        .mini-cal {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 15px;
        }
        .mini-cal th {
            color: #8c6d62;
            padding: 2px;
            font-size: 14px;
        }
        .mini-cal td {
            border: 1px solid #f0e6e2;
            padding: 4px;
            background: #fff;
            cursor: pointer;
        }
        .mini-cal td:hover { background: #f4ece6; }
        .mini-cal td.today { background: #b5838d; color: #fff; }
        .mini-cal td.muted { color: #d0c0bc; }

        /* Panel Derecho: Columnas Semanales (Lunes a Domingo) */
        .weekly-columns-area {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .week-navigation-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f4ece6;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .days-grid-columns {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }
        @media(max-width: 1300px) {
            .days-grid-columns { grid-template-columns: repeat(3, 1fr); }
        }
        @media(max-width: 800px) {
            .days-grid-columns { grid-template-columns: 1fr; }
        }

        /* Columna de Día Individual (Estilo de la imagen de referencia) */
        .day-column {
            background: #fcf9f7;
            border: 1px solid #e2d3ce;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .day-column-header {
            background: #e8d7d1;
            color: #5c453e;
            padding: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #d8c2bb;
        }
        .day-section-box {
            padding: 8px;
            border-bottom: 1px solid #eee4df;
        }
        .day-section-title {
            font-size: 14px;
            color: #8c6d62;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .focus-input, .task-input-box {
            width: 100%;
            background: #fff;
            border: 1px solid #d8c2bb;
            font-family: 'VT323', monospace;
            font-size: 16px;
            padding: 3px 6px;
            color: #3b3038;
            border-radius: 3px;
        }
        
        /* Lista de Tareas con barra de progreso por día */
        .task-list-column {
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 6px;
        }
        .task-row-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            margin-bottom: 3px;
            background: #fff;
            padding: 2px 4px;
            border-radius: 3px;
            border: 1px solid #f0e6e2;
        }
        .progress-container {
            background: #f0e6e2;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-bar-fill {
            background: #b5838d;
            height: 100%;
            width: 0%;
        }
        .delete-btn {
            background: none; border: none; color: #b5838d; cursor: pointer; font-size: 14px; font-weight: bold;
        }

        /* Avatar flotante de Hana */
        #hanaMascot {
            position: fixed;
            width: 50px; height: 50px;
            background: #b5838d;
            border: 2px solid #5c453e;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            box-shadow: 2px 2px 0px #ebd5cd;
            cursor: pointer;
            z-index: 9999;
            transition: transform 0.2s;
        }
        #hanaMascot:hover { transform: scale(1.15); }
    </style>
</head>
<body>

<div id="hanaMascot" title="¡Hola! Clic para hablar con Hana">🍓</div>

<div class="planner-container">
    <!-- Barra Superior -->
    <div class="top-bar">
        <div class="top-title">✨ WEEKLY PLAN // HANA.OS (Notion Aesthetic Edition)</div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <span id="currentMonthYearLabel" style="font-size: 16px; color: #8c6d62;">Septiembre 2026</span>
            <button class="retro-btn" onclick="exportData()">💾 Guardar Respaldo</button>
        </div>
    </div>

    <div class="main-grid">
        <!-- COLUMNA IZQUIERDA -->
        <div class="sidebar-left">
            <div>
                <div class="sidebar-section-title">Calendario (Sep 2026)</div>
                <table class="mini-cal">
                    <thead>
                        <tr><th>Lu</th><th>Ma</th><th>Mi</th><th>Ju</th><th>Vi</th><th>Sa</th><th>Do</th></tr>
                    </thead>
                    <tbody id="miniCalendarBody"></tbody>
                </table>
            </div>

            <div>
                <div class="sidebar-section-title">Hábitos Semanales</div>
                <div id="sidebarHabitsContainer"></div>
                <div style="display: flex; gap: 4px; margin-top: 6px;">
                    <input type="text" id="newHabitInput" class="focus-input" placeholder="Nuevo hábito...">
                    <button class="retro-btn" onclick="addHabit()">+</button>
                </div>
            </div>

            <div>
                <div class="sidebar-section-title">Notas Rápidas</div>
                <textarea id="quickNotesArea" class="focus-input" style="height: 100px; resize: none;" oninput="saveNotes()"></textarea>
            </div>
        </div>

        <!-- COLUMNA DERECHA: PLAN SEMANAL EN COLUMNAS -->
        <div class="weekly-columns-area">
            <div class="week-navigation-bar">
                <button class="retro-btn" onclick="changeWeek(-1)">◀ Semana Anterior</button>
                <span id="weekRangeLabel" style="font-weight: bold; font-size: 18px; color: #5c453e;">Semana</span>
                <button class="retro-btn" onclick="changeWeek(1)">Semana Siguiente ▶</button>
            </div>

            <!-- Contenedor de las 7 columnas de los días -->
            <div class="days-grid-columns" id="daysGridColumns"></div>
        </div>
    </div>
</div>

<script>
    let currentWeekOffset = 0;
    const diasNombres = ["LUNES", "MARTES", "MIÉRCOLES", "JUEVES", "VIERNES", "SÁBADO", "DOMINGO"];

    // Horario universitario predeterminado inyectado en las columnas
    const horarioUniversidad = {
        0: ["📚 SIST. OPE. 10am-1pm", "📚 EDA 2-5pm", "📚 EST. APL. 7-10pm"],
        1: ["📚 SIST. INTE. 7-10am", "📚 ING. PRO. 8-10pm"],
        2: ["📚 SIST. OPE. 10am-1pm", "📚 ING. SOFT. 4-6pm"],
        3: ["📚 EDA 2-5pm", "📚 EST. APL. 8-10pm"],
        4: ["📚 SIST. INTE. 7-9am", "📚 ING. SOFT. 3-6pm", "📚 ING. PRO. 8-10pm"],
        5: [],
        6: []
    };

    const frasesHana = [
        "«¡Qué organizada se ve tu semana con este estilo de Notion!»",
        "«No olvides revisar tus bloques de sistemas y bases de datos hoy.»",
        "«¡Vas excelente con tus entregas y proyectos universitarios!»"
    ];

    // Animación de Hana flotando
    const mascot = document.getElementById('hanaMascot');
    let posX = 40, posY = 40, velX = 1.0, velY = 0.7;
    function animateHana() {
        posX += velX; posY += velY;
        if (posX <= 10 || posX >= window.innerWidth - 60) velX *= -1;
        if (posY <= 10 || posY >= window.innerHeight - 60) velY *= -1;
        mascot.style.left = posX + 'px';
        mascot.style.top = posY + 'px';
        requestAnimationFrame(animateHana);
    }
    animateHana();
    mascot.onclick = function() {
        const f = frasesHana[Math.floor(Math.random() * frasesHana.length)];
        alert(f);
    };

    // Datos y Memoria Local robusta
    let notionData = JSON.parse(localStorage.getItem('hana_dashboard_v5')) || {
        days: {}, // Estructura: { '2026-09-21': { focus: '...', events: '...', tasks: [{text: '...', done: false}] } }
        habits: [
            { name: "Ejercicio", days: [false, false, false, false, false, false, false] },
            { name: "Lectura", days: [false, false, false, false, false, false, false] }
        ],
        notes: "Revisar pendientes de la API y reportes en Power BI."
    };

    function saveNotionData() {
        localStorage.setItem('hana_dashboard_v5', JSON.stringify(notionData));
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notionData));
        const anchor = document.createElement('a');
        anchor.setAttribute("href", dataStr);
        anchor.setAttribute("download", "hana_notion_backup.json");
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
    }

    function getMonday(d, offset) {
        d = new Date(d);
        d.setDate(d.getDate() + (offset * 7));
        var day = d.getDay(),
            diff = d.getDate() - day + (day == 0 ? -6:1);
        return new Date(d.setDate(diff));
    }

    function renderWeeklyPlanner() {
        const container = document.getElementById('daysGridColumns');
        container.innerHTML = '';

        let monday = getMonday(new Date(), currentWeekOffset);
        let sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        document.getElementById('weekRangeLabel').innerText = `Semana del ${monday.getDate()} de Sep al ${sunday.getDate()} de Sep, 2026`;

        for (let i = 0; i < 7; i++) {
            let currentDay = new Date(monday);
            currentDay.setDate(monday.getDate() + i);
            let dNum = currentDay.getDate();
            let dateKey = `2026-09-${dNum < 10 ? '0'+dNum : dNum}`;

            // Inicializar datos del día si no existen
            if (!notionData.days[dateKey]) {
                notionData.days[dateKey] = {
                    focus: i === 0 ? "Avanzar arquitectura de sistema" : "",
                    events: "",
                    tasks: (horarioUniversidad[i] || []).map(c => ({ text: c, done: false }))
                };
            }

            let dayObj = notionData.days[dateKey];

            // Calcular porcentaje de tareas completadas del día
            let totalTasks = dayObj.tasks.length;
            let completedTasks = dayObj.tasks.filter(t => t.done).length;
            let percent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

            let tasksHtml = '';
            dayObj.tasks.forEach((t, tIdx) => {
                tasksHtml += `
                    <li class="task-row-item">
                        <label style="display:flex; align-items:center; word-break:break-all;">
                            <input type="checkbox" ${t.done ? 'checked' : ''} onclick="toggleTask('${dateKey}', ${tIdx})">
                            <span style="${t.done ? 'text-decoration: line-through; color: #a08c85;' : ''}">${t.text}</span>
                        </label>
                        <button class="delete-btn" onclick="deleteTask('${dateKey}', ${tIdx})">×</button>
                    </li>
                `;
            });

            const col = document.createElement('div');
            col.className = 'day-column';
            col.innerHTML = `
                <div class="day-column-header">${diasNombres[i]} ${dNum}</div>
                
                <div class="day-section-box">
                    <div class="day-section-title">Today's Focus</div>
                    <input type="text" class="focus-input" value="${dayObj.focus}" oninput="updateFocus('${dateKey}', this.value)" placeholder="Enfoque del día...">
                </div>

                <div class="day-section-box">
                    <div class="day-section-title">Events / Citas</div>
                    <input type="text" class="focus-input" value="${dayObj.events}" oninput="updateEvents('${dateKey}', this.value)" placeholder="Ej: 4:00 PM Reunión...">
                </div>

                <div class="day-section-box" style="flex-grow:1; display:flex; flex-direction:column;">
                    <div class="day-section-title">
                        <span>Tasks</span>
                        <span>${percent}%</span>
                    </div>
                    <div class="progress-container"><div class="progress-bar-fill" style="width: ${percent}%;"></div></div>
                    <ul class="task-list-column" style="margin-top:6px;">${tasksHtml}</ul>
                    <div style="display:flex; gap:4px; margin-top:auto;">
                        <input type="text" id="newTaskInput-${dateKey}" class="task-input-box" placeholder="Nueva tarea...">
                        <button class="retro-btn" style="padding:2px 6px;" onclick="addTask('${dateKey}')">+</button>
                    </div>
                </div>
            `;
            container.appendChild(col);
        }
    }

    function changeWeek(dir) {
        currentWeekOffset += dir;
        renderWeeklyPlanner();
    }

    function updateFocus(dateKey, val) { notionData.days[dateKey].focus = val; saveNotionData(); }
    function updateEvents(dateKey, val) { notionData.days[dateKey].events = val; saveNotionData(); }

    function addTask(dateKey) {
        const input = document.getElementById(`newTaskInput-${dateKey}`);
        if (!input.value.trim()) return;
        notionData.days[dateKey].tasks.push({ text: input.value.trim(), done: false });
        saveNotionData();
        renderWeeklyPlanner();
    }

    function deleteTask(dateKey, tIdx) {
        notionData.days[dateKey].tasks.splice(tIdx, 1);
        saveNotionData();
        renderWeeklyPlanner();
    }

    function toggleTask(dateKey, tIdx) {
        notionData.days[dateKey].tasks[tIdx].done = !notionData.days[dateKey].tasks[tIdx].done;
        saveNotionData();
        renderWeeklyPlanner();
    }

    // --- MINI CALENDARIO Y HÁBITOS ---
    function renderSidebar() {
        // Calendario de Septiembre 2026
        const tbody = document.getElementById('miniCalendarBody');
        tbody.innerHTML = '';
        let dayCounter = 1, daysInMonth = 30, startDay = 1;
        let row = document.createElement('tr');
        for (let i = 0; i < startDay; i++) row.innerHTML += `<td class="muted">${31 - (startDay - i - 1)}</td>`;
        for (let i = startDay; i < 7; i++) {
            let isToday = (dayCounter === 17) ? 'today' : '';
            row.innerHTML += `<td class="${isToday}">${dayCounter}</td>`;
            dayCounter++;
        }
        tbody.appendChild(row);
        while (dayCounter <= daysInMonth) {
            row = document.createElement('tr');
            for (let i = 0; i < 7; i++) {
                if (dayCounter <= daysInMonth) {
                    let isToday = (dayCounter === 17) ? 'today' : '';
                    row.innerHTML += `<td class="${isToday}">${dayCounter}</td>`;
                    dayCounter++;
                } else {
                    row.innerHTML += `<td class="muted">${dayCounter - daysInMonth}</td>`;
                    dayCounter++;
                }
            }
            tbody.appendChild(row);
        }

        // Hábitos
        const hContainer = document.getElementById('sidebarHabitsContainer');
        hContainer.innerHTML = '';
        notionData.habits.forEach((h, hIdx) => {
            let daysHtml = '';
            h.days.forEach((checked, dIdx) => {
                daysHtml += `<div class="h-box ${checked ? 'active' : ''}" onclick="toggleHabit(${hIdx}, ${dIdx})">${diasNombres[dIdx][0]}</div>`;
            });
            hContainer.innerHTML += `
                <div class="habit-row-mini">
                    <span style="width:70px; overflow:hidden;">${h.name}</span>
                    <div class="habit-days-mini">${daysHtml}</div>
                    <button class="delete-btn" onclick="deleteHabit(${hIdx})">×</button>
                </div>
            `;
        });

        // Notas
        document.getElementById('quickNotesArea').value = notionData.notes;
    }

    function addHabit() {
        const input = document.getElementById('newHabitInput');
        if (!input.value.trim()) return;
        notionData.habits.push({ name: input.value.trim(), days: [false, false, false, false, false, false, false] });
        input.value = '';
        saveNotionData();
        renderSidebar();
    }
    function deleteHabit(hIdx) { notionData.habits.splice(hIdx, 1); saveNotionData(); renderSidebar(); }
    function toggleHabit(hIdx, dIdx) {
        notionData.habits[hIdx].days[dIdx] = !notionData.habits[hIdx].days[dIdx];
        saveNotionData();
        renderSidebar();
    }
    function saveNotes() {
        notionData.notes = document.getElementById('quickNotesArea').value;
        saveNotionData();
    }

    window.onload = function() {
        renderSidebar();
        renderWeeklyPlanner();
    };
</script>

</body>
</html>
